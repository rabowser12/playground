<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Practice Name</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f5f0eb;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    :root {
      --sage:    #6b8f71;
      --sage-dk: #4a6b50;
      --warm:    #f5f0eb;
      --muted:   #718096;
      --border:  #e2e8f0;
      --text:    #2d3748;
    }
    .nav-logo {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
      text-decoration: none;
    }
    .eyebrow {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .message {
      font-size: 1rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn-primary {
      display: inline-block;
      background: var(--sage);
      color: #fff;
      padding: 0.85rem 2rem;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--sage-dk); }
  </style>
</head>
<body>

  <a href="./index.html" class="nav-logo">Practice Name</a>

  <p class="eyebrow">404 — Page Not Found</p>
  <h1>We couldn't find that page.</h1>
  <p class="message">The page you're looking for may have moved or no longer exists. Let's get you back to where you need to be.</p>
  <a href="./index.html" class="btn-primary">Return to Home</a>

</body>
</html>
